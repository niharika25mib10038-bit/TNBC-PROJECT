version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tnbc-insight-backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/models:/app/models
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./tnbc_insight.db
      - MODEL_PATH=models/resnet50_tnbc.pth
      - UPLOAD_DIR=uploads
      - MAX_FILE_SIZE_MB=50
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - DEBUG=true
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tnbc-insight-frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped
